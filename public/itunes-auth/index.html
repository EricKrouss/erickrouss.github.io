<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self' https://js-cdn.music.apple.com https://*.apple.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.apple.com https://*.itunes.apple.com https://*.mzstatic.com https://*.aaplimg.com http://127.0.0.1:*; frame-src https://*.apple.com; img-src 'self' data: https://*.apple.com https://*.mzstatic.com; media-src blob: https://*.apple.com https://*.itunes.apple.com https://*.mzstatic.com; worker-src 'self' blob:; form-action https://authorize.music.apple.com">
  <title>Connect Apple Music to iTunes</title>
  <link rel="stylesheet" href="/itunes-shared/style.css">
  <script src="/itunes-shared/musickit-bootstrap.js?v=5580e443c147" defer></script>
  <script src="/itunes-auth/auth.js?v=fd11f8937293" defer></script>
</head>
<body>
  <main>
    <p class="icon" aria-hidden="true">♫</p>
    <h1>Connect Apple Music</h1>
    <p id="status" role="status" aria-live="polite">Checking the request from iTunes…</p>
    <p class="detail" id="detail">Sign in with Apple to connect your subscription to the iTunes client on this computer.</p>
    <div class="actions">
      <button class="primary" id="sign-in" disabled>Sign In</button>
      <button id="cancel" disabled>Cancel</button>
    </div>
    <noscript>JavaScript is required to connect Apple Music.</noscript>
  </main>
</body>
</html>
